# Üretim ortamı (test modu — Stripe test anahtarı, pre-setup C6).
# Sunucuda deponun kökünden: deploy/dagit.sh (doğrudan çağırma; ön kontrol
# ve sürüm ölçümü betikte). Değerler deploy/.env.uretim'de (git dışı).
name: myweb2wave-uretim

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: app
    # Port dışarı açılmaz; yalnız iç ağdaki çekirdek bağlanır.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql

  core:
    build:
      context: ../core
      target: uretim
    image: myweb2wave-core:uretim
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:?}
      APP_SECRET: ${APP_SECRET:?}
      DEFAULT_URI: https://${API_ALANI:?}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?}@db:5432/app?serverVersion=18&charset=utf8
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      STRIPE_PRICE_KEEPCHAT_MONTHLY: ${STRIPE_PRICE_KEEPCHAT_MONTHLY:?}
      FUNNEL_BASE_URL: https://${HUNI_ALANI:?}
      MAILER_DSN: ${MAILER_DSN:?}
      MAIL_GONDEREN: ${MAIL_GONDEREN:?}
      UYGULAMA_ANAHTARI_KEEPCHAT: ${UYGULAMA_ANAHTARI_KEEPCHAT:?}
      PANEL_KULLANICI: ${PANEL_KULLANICI:?}
      PANEL_SIFRE_OZETI: ${PANEL_SIFRE_OZETI:?}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        PUBLIC_CORE_URL: https://${API_ALANI:?}
    image: myweb2wave-web:uretim
    restart: unless-stopped
    environment:
      API_ALANI: ${API_ALANI:?}
      HUNI_ALANI: ${HUNI_ALANI:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Sertifikalar burada; silinirse Let's Encrypt sınırına takılabilir.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
