# Yerel geliştirme ortamı. Portlar KeepChat'le çakışmasın diye 5435 / 8081
# (5434, 6380 KeepChat'te dolu — ölçüm 2026-10-19).
name: myweb2wave

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Postgres 18 veriyi /var/lib/postgresql/<sürüm>/docker altında tutuyor;
      # bağlama noktası bir üst dizin.
      - db-data:/var/lib/postgresql

  core:
    build:
      context: ./core
      target: taban
    image: myweb2wave-core:dev
    environment:
      SERVER_NAME: ":80"
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8081:80"
    volumes:
      - ./core:/app
      # Sözleşme testleri gerçek yanıtları buna göre doğrular (R2).
      - ./contract/openapi.yaml:/contract/openapi.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  # Yerel e-posta yakalayıcı (MIT): kod e-postaları buraya düşer,
  # http://localhost:8025 — gerçek kutuya gitmez.
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "8025:8025"

  # Testler gerçek Stripe'a değil Stripe'ın resmi sahte API'sine gider (MIT):
  # parametreleri Stripe'ın OpenAPI tanımına göre doğrular, ağ gerektirmez.
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78

  # Gerçek istekle doğrulama: Stripe test olaylarını yerel çekirdeğe iletir.
  # `docker compose run --rm stripe-cli listen --forward-to core:80/webhooks/stripe`
  stripe-cli:
    image: stripe/stripe-cli:v1.53.1@sha256:11c46caeead82e329f14823dd622d494b4cc8c1b9766f724d122d2af42c97540
    profiles: ["araclar"]
    env_file: core/.env.local

  # Yalnız araç: `docker compose run --rm funnel npm run check`.
  # node_modules adlandırılmış birimde — macOS'ta kurulan yerel ikililer
  # Linux konteynerinde çalışmaz.
  funnel:
    build: ./funnel
    image: myweb2wave-funnel:dev
    profiles: ["araclar"]
    volumes:
      - ./funnel:/app
      - funnel-node-modules:/app/node_modules

  # Sözleşmeden huni tiplerini üretir; huni dizinine yazar.
  contract:
    build: ./contract
    image: myweb2wave-contract:dev
    profiles: ["araclar"]
    volumes:
      - ./contract:/app
      - ./funnel:/funnel
      - contract-node-modules:/app/node_modules

volumes:
  db-data:
  funnel-node-modules:
  contract-node-modules:
