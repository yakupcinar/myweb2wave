# Yerel geliştirme ortamı. Portlar KeepChat'le çakışmasın diye 5435 / 8081
# (5434, 6380 KeepChat'te dolu — ölçüm 2026-10-19).
name: myweb2wave

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Postgres 18 veriyi /var/lib/postgresql/<sürüm>/docker altında tutuyor;
      # bağlama noktası bir üst dizin.
      - db-data:/var/lib/postgresql

  core:
    build: ./core
    image: myweb2wave-core:dev
    environment:
      SERVER_NAME: ":80"
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8081:80"
    volumes:
      - ./core:/app
    depends_on:
      db:
        condition: service_healthy

  # Yalnız araç: `docker compose run --rm funnel npm run check`.
  # node_modules adlandırılmış birimde — macOS'ta kurulan yerel ikililer
  # Linux konteynerinde çalışmaz.
  funnel:
    build: ./funnel
    image: myweb2wave-funnel:dev
    profiles: ["araclar"]
    volumes:
      - ./funnel:/app
      - funnel-node-modules:/app/node_modules

volumes:
  db-data:
  funnel-node-modules:
