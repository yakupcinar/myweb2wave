# A4: Kendi uygulamalarımız. Yeni uygulama = buraya bir satır + sözleşmede
# (contract/openapi.yaml) app enum'una bir değer. Planlar M1a'dan beri
# veritabanında (`planlar`, panel → Planlar; eski fiyat: app:plan-ice-aktar).
parameters:
    uygulamalar:
        keepchat: {}
    # A5: uygulamanın SUNUCUSU çekirdeğe bununla sorar; uygulamanın içinde yok.
    uygulama_anahtarlari:
        keepchat: '%env(UYGULAMA_ANAHTARI_KEEPCHAT)%'
    # A9: RevenueCat'teki bu uygulamanın STRIPE uygulaması açık API anahtarı
    # (Project → Apps → Stripe). Boşsa aktarım KAPALI (hiçbir şey kuyruğa girmez).
    revenuecat_anahtarlari:
        keepchat: '%env(REVENUECAT_STRIPE_KEEPCHAT)%'
    # Ç46: ödeme sonrası giriş bağlantısı uygulamayı bu özel URL şemasıyla
    # açar (<şema>://giris?jeton=…). Uygulama Info.plist'inde aynısı olmalı.
    uygulama_semalari:
        keepchat: keepchat
