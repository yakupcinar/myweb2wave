# A4: Kendi uygulamalarımız ve planları. Fiyat kimliği ortama göre (test /
# canlı) değiştiği için ortam değişkeninden. Yeni uygulama = buraya bir blok
# + sözleşmede (contract/openapi.yaml) app enum'una bir değer.
parameters:
    uygulamalar:
        keepchat:
            monthly: '%env(STRIPE_PRICE_KEEPCHAT_MONTHLY)%'
    # A5: uygulamanın SUNUCUSU çekirdeğe bununla sorar; uygulamanın içinde yok.
    uygulama_anahtarlari:
        keepchat: '%env(UYGULAMA_ANAHTARI_KEEPCHAT)%'
    # A9: RevenueCat'teki bu uygulamanın STRIPE uygulaması açık API anahtarı
    # (Project → Apps → Stripe). Boşsa aktarım KAPALI (hiçbir şey kuyruğa girmez).
    revenuecat_anahtarlari:
        keepchat: '%env(REVENUECAT_STRIPE_KEEPCHAT)%'
