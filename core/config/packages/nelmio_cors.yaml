# Tarifin varsayılanı (localhost'un her portu, bütün yollar, DELETE/PUT dahil)
# fazla genişti. Yalnız huninin kökeni, yalnız huninin uçları; yazanlar POST,
# huni tanımı yalnız GET.
# Köken FUNNEL_BASE_URL'den — ayrı bir CORS değişkeni iki kaynak demek.
nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_methods: []
        allow_headers: []
        max_age: 3600
    paths:
        # H6a/Ç56: izin verme ve geri alma uçları da; CORS'tan biri eksikse
        # tarayıcıda sessizce düşer (durum 0), sunucu testleri yeşil kalır.
        '^/(checkout/sessions|huni/giris-baglantisi|huni/ziyaretler(/[0-9a-f-]{36}/(ilerleme|izin))?)$':
            allow_origin: ['%env(FUNNEL_BASE_URL)%']
            allow_methods: ['POST', 'DELETE', 'OPTIONS']
            allow_headers: ['Content-Type']
        # Huni tanımı (A7): yayındaki sürüm ve imzalı önizleme — yalnız okuma.
        '^/huni/[a-z0-9_-]+(/taslak)?$':
            allow_origin: ['%env(FUNNEL_BASE_URL)%']
            allow_methods: ['GET']
