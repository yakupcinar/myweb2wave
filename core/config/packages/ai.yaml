# A2: panel içi AI asistanı. Model ve efor ayarı burada; değerlendirme (A6)
# sonrası ölçülerek değişir. Opus 5.5'te düşünme kapatılamaz, efor varsayılanı
# medium — açıkça yazılır (docs/decisions/ai-a2-panel-arka-uc.md).
parameters:
    ai.model: 'claude-opus-5-5'
    ai.efor: 'medium'
    # Bir sohbet isteğinde en çok API turu (araç çağrısı + düzeltme döngüsü).
    ai.azami_tur: 8
    # Tur başına yanıt sınırı (akışsız istek: SDK zaman aşımı altında kalır).
    ai.azami_jeton: 16000

framework:
    rate_limiter:
        # Maliyet bekçisi: yönetici başına saatte 30 sohbet isteği.
        ai_sohbet:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
