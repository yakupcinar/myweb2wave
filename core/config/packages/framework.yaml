# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Ç34/H6b: üretimde çekirdek Caddy'nin arkasında (yalnız Caddy dışa açık,
    # çekirdek iç ağda). Vekil güvenilmezse her ziyaretçi Caddy'nin IP'sinden
    # gelmiş görünür: reklam ağına giden IP ve hız sınırı anahtarı yanlış olur.
    # Caddy istemcinin yolladığı X-Forwarded-For'u yok sayıp kendisi yazar.
    trusted_proxies: 'private_ranges'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    # Ç35/Ç41: oturumlar Postgres'te (kap yeniden kurulunca düşmez) ve boşta
    # 8 saat yaşar — PHP varsayılanı 1440 sn'de düzenleyicideki iş kayboluyordu.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        gc_maxlifetime: 28800

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Dış HTTP (RevenueCat, A9) testte hiç ağa çıkmaz; istekler kaydedilir.
        http_client:
            mock_response_factory: App\Tests\Support\SahteRevenueCat

# Üretimde çekirdek Caddy'nin arkasında düz HTTP görür; 'auto' bu yüzden
# panel çerezine Secure koymuyordu (ölçüldü, panel.md). Tarayıcıya giden
# her bağlantı HTTPS.
when@prod:
    framework:
        session:
            cookie_secure: true
