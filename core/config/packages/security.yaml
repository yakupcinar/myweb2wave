# İç panel (A6/2): tek yönetici, kullanıcı adı + şifre (kullanıcı kararı
# 2026-10-20). Güvenlik duvarı YALNIZ /panel: API uçları güvenlik katmanına
# hiç girmez (tarifin varsayılanı her yolu kapsıyordu). Not: deseni
# kaldırmak ölçülebilir fark yaratmadı — lazy duvar API'ye çerez vermiyor
# (panel.md P5); desen yine de kapsamı sözle değil yapıyla sınırlıyor.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        yonetici:
            id: App\Panel\YoneticiSaglayici

    firewalls:
        panel:
            pattern: ^/panel
            provider: yonetici
            form_login:
                login_path: panel_giris
                check_path: panel_giris
                default_target_path: panel
                enable_csrf: true
            logout:
                path: panel_cikis
                target: panel_giris
            # Şifre denemesi: kullanıcı adı + IP başına dakikada 5.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/panel/giris$, roles: PUBLIC_ACCESS }
        - { path: ^/panel, roles: ROLE_YONETICI }

when@test:
    security:
        password_hashers:
            # Testte en düşük maliyet (tarif): üretimde 'auto' varsayılanı.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
