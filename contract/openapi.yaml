      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: anahtar, in: path, required: true, schema: { type: string } }
    put:
      operationId: panelApiPlanParaBirimleri
      summary: "M1c — planın ek para birimleri (elle sabit tutar); yeni Stripe fiyatı açılır, mevcut aboneler eskisinde kalır. Boş eşleme kaldırır"
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
