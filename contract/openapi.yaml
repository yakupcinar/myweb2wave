                        iptalDonemSonu: { type: boolean, description: "M6a — dönem sonunda iptal planlı (geri alınabilir)" }
                        donemSonu: { type: [string, "null"], description: "M6a — geçerli dönemin sonu (UTC); iptal planlıysa erişimin bittiği an" }
