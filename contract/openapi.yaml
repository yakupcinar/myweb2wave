# Huni ↔ çekirdek sözleşmesi (R2) — TEK KAYNAK.
# Çekirdek: testlerde gerçek yanıtlar buna göre doğrulanır.
# Huni: TypeScript tipleri buradan ÜRETİLİR (contract/ → funnel/src/sozlesme/api.ts);
# bin/kontrol üretilen dosyanın güncel olduğunu ölçer.
openapi: 3.1.0
info:
  title: MyWeb2Wave çekirdek API
  version: 0.1.0
paths:
  /checkout/sessions:
    post:
      operationId: createCheckoutSession
      summary: Paywall'dan Stripe Checkout oturumu açar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, plan]
              properties:
                app:
                  description: Hangi kendi uygulamamız (A4); çekirdek config/packages/uygulamalar.yaml
                  type: string
                  enum: [keepchat]
                plan:
                  type: string
                  enum: [monthly]
                ziyaret:
                  description: /huni/ziyaretler'in döndürdüğü kimlik (A6); tanınmazsa ödeme yine açılır
                  type: string
                  format: uuid
      responses:
        "201":
          description: Oturum açıldı; istemci url'ye yönlenir
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          description: Gövde JSON değil
        "422":
          description: Bilinmeyen uygulama ya da plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hata"
        "502":
          description: Ödeme sağlayıcısına ulaşılamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hata"
  /huni/ziyaretler:
    post:
      operationId: recordFunnelVisit
      summary: Huni sayfası açıldı; hangi reklamdan geldiği (A6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app]
              properties:
                app: { type: string, enum: [keepchat] }
                utm_source: { $ref: "#/components/schemas/AtifAlani" }
                utm_medium: { $ref: "#/components/schemas/AtifAlani" }
                utm_campaign: { $ref: "#/components/schemas/AtifAlani" }
                utm_content: { $ref: "#/components/schemas/AtifAlani" }
                utm_term: { $ref: "#/components/schemas/AtifAlani" }
                fbclid: { $ref: "#/components/schemas/AtifAlani" }
                ttclid: { $ref: "#/components/schemas/AtifAlani" }
                huni: { $ref: "#/components/schemas/HuniKimligi" }
                surum: { type: integer, minimum: 1, description: "Görülen huni ve sürümü (A7, A8); yayınlanmış bir çift değilse yok sayılır" }
                izin: { type: boolean, description: "Reklam ölçümü izni önceden verildi (H6a, A12). Yoksa fbclid/ttclid saklanmaz" }
      responses:
        "201":
          description: Kaydedildi; ödeme oturumu açarken gönderilecek kimlik
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ziyaret]
                properties:
                  ziyaret: { type: string, format: uuid }
        "400": { description: Gövde JSON değil }
        "422":
          description: Bilinmeyen uygulama ya da geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "429":
          description: "Ç34: bu IP'den dakikada 120'den fazla ziyaret; huni yine çalışır"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/{app}:
    get:
      operationId: getPublishedFunnel
      summary: Kuralların seçtiği huninin yayınlanmış en son tanımı (A7, A8); 60 sn önbellek
      description: Yalnız seçim parametrelerini gönder (fbclid gibi tıklama kimlikleri önbelleği bozar).
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: k, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_source, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_campaign, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_content, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: huni, in: query, required: false, description: Doğrudan test adresi, schema: { $ref: "#/components/schemas/HuniKimligi" } }
      responses:
        "200":
          description: Yayındaki sürüm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuniYayini" }
        "404":
          description: Yayınlanmış huni yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/{app}/taslak:
    get:
      operationId: getDraftFunnel
      summary: İmzalı, süreli önizleme anahtarıyla bir huninin taslağı ya da yayındaki sürümü (A7, Ç70)
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: huni, in: query, required: true, schema: { $ref: "#/components/schemas/HuniKimligi" } }
        - { name: anahtar, in: query, required: true, schema: { type: string } }
        - { name: yayin, in: query, required: false, description: "1 ise taslak yerine yayındaki son sürüm (Ç70: panelden ölçümsüz bakış)", schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Taslak (surum null) ya da yayin=1 ile yayındaki sürüm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuniYayini" }
        "403":
          description: Anahtar yok, yanlış ya da süresi geçmiş; yayin=1 ise huni yayınlanmamış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/ziyaretler/{ziyaret}/ilerleme:
    post:
      operationId: recordFunnelProgress
      summary: Anket adımına ulaşıldı ya da adımın cevabı verildi (A6)
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sira, adim]
              properties:
                sira: { type: integer, minimum: 0, maximum: 50, description: Adımın huni tanımındaki sırası }
                adim: { $ref: "#/components/schemas/HuniKimligi" }
                cevap: { $ref: "#/components/schemas/HuniKimligi" }
                cevaplar:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/HuniKimligi" }
                cevapMetni: { type: string, maxLength: 500 }
              not:
                required: [cevap, cevaplar]
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422":
          description: Geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/ziyaretler/{ziyaret}/izin:
    post:
      operationId: grantMeasurementConsent
      summary: Onay şeridinde reklam ölçümüne izin verildi (H6a, A12); o anki tıklama kimlikleri
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fbclid: { $ref: "#/components/schemas/AtifAlani" }
                ttclid: { $ref: "#/components/schemas/AtifAlani" }
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422":
          description: Geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
    delete:
      operationId: revokeMeasurementConsent
      summary: Ziyaretin reklam ölçümü iznini geri al; bekleyen paylaşım yüklerini sil
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: İzin geri alındı }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/giris-baglantisi:
    post:
      operationId: createLoginLink
      summary: Başarı sayfası ödemeden sonra tek kullanımlık giriş bağlantısı ister (Ç46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, oturum]
              properties:
                app:
                  type: string
                  enum: [keepchat]
                oturum:
                  description: Stripe Checkout oturum kimliği (başarı sayfası adresindeki session_id)
                  type: string
                  pattern: "^cs_[A-Za-z0-9_]{1,250}$"
      responses:
        "201":
          description: Bağlantı üretildi; tek kullanımlık, süreli
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uygulama_adresi, son_kullanma]
                properties:
                  uygulama_adresi: { type: string, description: "<şema>://giris?jeton=… — uygulamayı açar" }
                  son_kullanma: { type: string, format: date-time }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ödeme henüz işlenmedi (webhook gelmedi) ya da yok — sayfa yeniden dener
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "410":
          description: Ödemeden sonraki pencere kapandı; bağlantı e-postada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
        "429":
          description: Bu ödeme için bağlantı sınırı doldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/giris/kullan:
    post:
      operationId: redeemLoginLink
      summary: Uygulamanın SUNUCUSU giriş bağlantısındaki jetonu kullanır; kullanıcıyı kişiye bağlar (Ç46)
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jeton, kullanici]
              properties:
                jeton: { type: string, minLength: 1 }
                kullanici: { type: string, minLength: 1, description: Uygulamadaki kullanıcı kimliği }
      responses:
        "200":
          description: Bağlandı; jeton artık geçersiz
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kisi]
                properties:
                  kisi: { type: string, format: uuid }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
  /apps/{app}/baglama/kod:
    post:
      operationId: requestLinkCode
      summary: Uygulamanın SUNUCUSU kullanıcının e-postasına 6 haneli kod gönderir (A5)
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Kod gönderildi (e-postanın varlığı dışarıdan anlaşılmaz) }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
        "429":
          description: Bu e-postaya 10 dakikada 3'ten fazla kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/baglama/dogrula:
    post:
      operationId: verifyLinkCode
      summary: Kod doğruysa uygulamadaki kullanıcıyı kişiye bağlar
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, kod, kullanici]
              properties:
                email: { type: string, format: email }
                kod: { type: string, pattern: "^[0-9]{6}$" }
                kullanici: { type: string, minLength: 1, description: Uygulamadaki kullanıcı kimliği }
      responses:
        "200":
          description: Bağlandı
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kisi]
                properties:
                  kisi: { type: string, format: uuid, description: Kalıcı kişi kimliği (ileride StoreKit appAccountToken) }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
  /apps/{app}/kullanicilar/{kullanici}/hak:
    get:
      operationId: getEntitlement
      summary: Bu kullanıcının bu uygulamada aktif aboneliği var mı (A5 erişim kuralı)
      security: [{ uygulamaAnahtari: [] }]
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: kullanici, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Hak
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [aktif, durum]
                properties:
                  aktif: { type: boolean }
                  durum: { type: [string, "null"], description: En iyi aboneliğin Stripe durumu; abonelik yoksa null }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "404":
          description: Kullanıcı hiçbir kişiye bağlanmamış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /panel/api/rapor:
    get:
      operationId: panelRaporu
      summary: Panel raporu (A6/2, B5) — yalnız oturumlu yönetici; girişsizse güvenlik duvarı /panel/giris'e yönlendirir
      parameters:
        - name: gun
          in: query
          required: false
          description: Zaman aralığı; tanınmayan değer 30 sayılır
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: Seçilen aralıktaki sayımlar, izin oranı, anket ve ziyaret satırları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelRaporu" }
  /panel/api/ai/durum:
    get:
      operationId: panelAiDurumu
      summary: Panel AI asistanı açık mı (A2) — anahtar yoksa kapalı
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelAiDurumu" }
  /panel/api/ai/huniler/{app}/{huni}/sohbet:
    post:
      operationId: panelAiSohbet
      summary: İstemi açık huninin TASLAĞINA uygular (A2); ilerleme Server-Sent Events. Yayınlamaz.
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
        - { name: huni, in: path, required: true, schema: { $ref: "#/components/schemas/HuniKimligi" } }
        - name: X-CSRF-Token
          in: header
          required: true
          description: Düzenleyici sayfasının jetonu (huni-<app>)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [istem]
              properties:
                istem: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: "Olay akışı: her olay `event: <tur>` + `data: <JSON>` (PanelAiOlayi); son olay bitti"
          content:
            text/event-stream:
              schema: { type: string }
        "403": { description: CSRF jetonu geçersiz, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Huni yok, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: İstem boş ya da çok uzun, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "429": { description: Saatlik sınır, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "503": { description: AI kapalı (anahtar yok), content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar:
    get:
      operationId: panelUygulamalari
      summary: Paneldeki uygulamalar (A4)
      responses:
        "200":
          description: Uygulama adları
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uygulamalar]
                properties:
                  uygulamalar: { type: array, items: { type: string } }
  /panel/api/uygulamalar/{app}/baglam:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
    get:
      operationId: panelUrunBaglami
      summary: Uygulamanın ürün bağlamı (A4) — AI asistanının sistem istemine girer
      responses:
        "200": { description: Bağlam (boş alanlar ""), content: { application/json: { schema: { $ref: "#/components/schemas/UrunBaglami" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
    put:
      operationId: panelUrunBaglamiKaydet
      summary: Ürün bağlamını kaydeder (tamamını)
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, description: Panel uygulamasının jetonu (panel-api; kabuğun data-jeton'u), schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UrunBaglami" }
      responses:
        "200": { description: Kaydedilen bağlam, content: { application/json: { schema: { $ref: "#/components/schemas/UrunBaglami" } } } }
        "403": { description: CSRF jetonu geçersiz, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Alan çok uzun ya da geçersiz, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/anahtarlar:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
    get:
      operationId: panelApiAnahtarlari
      summary: Kişisel API anahtarları (A5a, MCP) — anahtarın kendisi yok, yalnız önek
      responses:
        "200":
          description: MCP adresi ve anahtarlar
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mcpAdresi, anahtarlar]
                properties:
                  mcpAdresi: { type: string }
                  anahtarlar: { type: array, items: { $ref: "#/components/schemas/ApiAnahtari" } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
    post:
      operationId: panelApiAnahtariOlustur
      summary: Yeni anahtar — kendisi YALNIZ bu yanıtta döner
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ad]
              properties:
                ad: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, ad, anahtar]
                properties:
                  id: { type: integer }
                  ad: { type: string }
                  anahtar: { type: string, pattern: "^mw2w_[0-9a-f]{48}$" }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Ad geçersiz, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/anahtarlar/{id}:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: panelApiAnahtariIptal
      summary: Anahtarı iptal eder (geri alınamaz)
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: İptal edildi }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Yok ya da zaten iptal, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
components:
  securitySchemes:
    uygulamaAnahtari:
      type: http
      scheme: bearer
      description: Uygulama başına gizli anahtar; YALNIZ uygulamanın sunucusunda (A5)
  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { type: string }
  responses:
    Yetkisiz:
      description: Anahtar yok, yanlış ya da başka uygulamanın
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
    IstekHatasi:
      description: Geçersiz alan ya da kod
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
  schemas:
    ApiAnahtari:
      type: object
      additionalProperties: false
      required: [id, ad, onek, olusturma, sonKullanim, iptal]
      properties:
        id: { type: integer }
        ad: { type: string }
        onek: { type: string, description: "Anahtarın ilk 11 karakteri (mw2w_xxxxxx) — tanımak için" }
        olusturma: { type: string }
        sonKullanim: { type: [string, "null"] }
        iptal: { type: boolean }
    UrunBaglami:
      description: "A4: yöneticinin yazdığı ürün tanımı; AI metinleri buna göre yazar"
      type: object
      additionalProperties: false
      required: [urun, kategori, kitle, ton, yasaklar]
      properties:
        urun: { type: string, maxLength: 1000, description: Ürün ne yapıyor }
        kategori: { type: string, maxLength: 100 }
        kitle: { type: string, maxLength: 500, description: Hedef kitle }
        ton: { type: string, maxLength: 200, description: Metinlerin tonu }
        yasaklar: { type: string, maxLength: 1000, description: Asla yazılmayacaklar / kaçınılacaklar }
    PanelHatalari:
      type: object
      additionalProperties: false
      required: [hatalar]
      properties:
        hatalar: { type: array, items: { type: string } }
    PanelAiDurumu:
      type: object
      additionalProperties: false
      required: [acik, model]
      properties:
        acik: { type: boolean }
        model: { type: string }
    PanelAiOlayi:
      description: "SSE olayının data alanı; tur, event satırıyla aynı"
      oneOf:
        - { type: object, additionalProperties: false, required: [tur, metin], properties: { tur: { type: string, enum: [metin] }, metin: { type: string } } }
        - { type: object, additionalProperties: false, required: [tur, ad], properties: { tur: { type: string, enum: [arac] }, ad: { type: string } } }
        - { type: object, additionalProperties: false, required: [tur, ad, hata], properties: { tur: { type: string, enum: [arac_sonucu] }, ad: { type: string }, hata: { type: boolean } } }
        - type: object
          additionalProperties: false
          required: [tur, imza, tanim]
          properties:
            tur: { type: string, enum: [taslak] }
            imza: { type: [string, "null"] }
            tanim: { $ref: "#/components/schemas/HuniTanimi" }
        - { type: object, additionalProperties: false, required: [tur, mesaj], properties: { tur: { type: string, enum: [hata] }, mesaj: { type: string } } }
        - type: object
          additionalProperties: false
          required: [tur, sonuc, kaydedildi, tur_sayisi, maliyetMikrodolar]
          properties:
            tur: { type: string, enum: [bitti] }
            sonuc: { type: string, enum: [tamam, tur_siniri, reddedildi, jeton_siniri, hata] }
            kaydedildi: { type: boolean }
            tur_sayisi: { type: integer, minimum: 0 }
            maliyetMikrodolar: { type: [integer, "null"] }
    PanelSayimi:
      type: object
      additionalProperties: false
      required: [ziyaret, odemeye_gecti, odedi]
      properties:
        ziyaret: { type: integer, minimum: 0 }
        odemeye_gecti: { type: integer, minimum: 0 }
        odedi: { type: integer, minimum: 0 }
    PanelRaporu:
      type: object
      additionalProperties: false
      required: [gun, gunler, azami, sayimlar, izinler, satirlar, adimlar, cevaplar, metinCevaplari]
      properties:
        gun: { type: integer, enum: [7, 30, 90] }
        gunler:
          type: array
          items: { type: integer, enum: [7, 30, 90] }
        azami:
          description: Satır listelerinin üst sınırı (en yeni N); sayımlar tüm aralığı kapsar
          type: integer
        sayimlar:
          type: object
          additionalProperties: false
          required: [reklam, organik]
          properties:
            reklam: { $ref: "#/components/schemas/PanelSayimi" }
            organik: { $ref: "#/components/schemas/PanelSayimi" }
        izinler:
          description: Ç56 (3) — yalnız sayı, kim olduğu yok
          type: object
          additionalProperties: false
          required: [kabul, red, secmeyen]
          properties:
            kabul: { type: integer, minimum: 0 }
            red: { type: integer, minimum: 0 }
            secmeyen: { type: integer, minimum: 0 }
        satirlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, huni, kaynak, kampanya, reklam, asama, durum, email]
            properties:
              zaman: { type: string }
              app: { type: string }
              huni: { type: [string, "null"] }
              kaynak: { type: string }
              kampanya: { type: [string, "null"] }
              reklam: { type: boolean }
              asama: { type: string, enum: ["sayfayı gördü", "ödemeye geçti", "ödedi"] }
              durum: { type: [string, "null"] }
              email:
                description: Maskeli (a***@example.com); açık e-posta panele hiç gelmez
                type: [string, "null"]
        adimlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, huni, sira, adim, ulasan]
            properties:
              app: { type: string }
              huni: { type: string }
              sira: { type: integer, minimum: 0 }
              adim: { type: string }
              ulasan: { type: integer, minimum: 0 }
        cevaplar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, soru, secenek, sayi]
            properties:
              app: { type: string }
              soru: { type: string }
              secenek: { type: string }
              sayi: { type: integer, minimum: 0 }
        metinCevaplari:
          description: 90 gün içinde, en yeni azami kadar
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, soru, cevap]
            properties:
              zaman: { type: string }
              app: { type: string }
              soru: { type: string }
              cevap: { type: string }
    AtifAlani:
      type: string
      maxLength: 500
    HuniYayini:
      type: object
      additionalProperties: false
      required: [huni, surum, tanim]
      properties:
        huni: { $ref: "#/components/schemas/HuniKimligi" }
        surum: { type: [integer, "null"], description: Yayınlanmış sürüm; taslakta null }
        tanim: { $ref: "#/components/schemas/HuniTanimi" }
        fiyatlar:
          description: >-
            Ç19/Ç21: plan → Stripe fiyatı (tek kaynak). Stripe'a ulaşılamazsa
            ya da fiyat tek aralıklı yinelenen değilse yok — paywall yalnız
            metnini gösterir.
          type: object
          additionalProperties: { $ref: "#/components/schemas/PlanFiyati" }
    PlanFiyati:
      type: object
      additionalProperties: false
      required: [tutar, paraBirimi, aralik]
      properties:
        tutar: { type: number, description: Ana birimde (9.99) }
        paraBirimi: { type: string, pattern: "^[A-Z]{3}$" }
        aralik: { type: string, enum: [day, week, month, year] }
    HuniTanimi:
      description: Çekirdekte core/src/Huni/Tanim.php doğrular; metinler düz metin (HTML yok)
      type: object
      additionalProperties: false
      required: [sayfaBasligi, adimlar]
      properties:
        sayfaBasligi: { type: string, minLength: 1, maxLength: 120 }
        tema: { $ref: "#/components/schemas/HuniTemasi" }
        logo:
          description: "Ç61: sayfanın başındaki logo (isteğe bağlı, temadan bağımsız)"
          allOf: [{ $ref: "#/components/schemas/GorselKimligi" }]
        adimlar:
          type: array
          minItems: 2
          maxItems: 50
          items:
            oneOf:
              - $ref: "#/components/schemas/TanitimAdimi"
              - $ref: "#/components/schemas/SoruAdimi"
              - $ref: "#/components/schemas/YorumAdimi"
              - $ref: "#/components/schemas/PaywallAdimi"
    HuniTemasi:
      description: "Huni başına görünüm (E2.2); çekirdekte core/src/Huni/Tema.php doğrular (kontrast dahil)"
      type: object
      additionalProperties: false
      required: [anaRenk, arkaPlan, metinRengi, yaziTipi, kose]
      properties:
        anaRenk: { type: string, pattern: "^#[0-9a-f]{6}$" }
        arkaPlan: { type: string, pattern: "^#[0-9a-f]{6}$" }
        metinRengi: { type: string, pattern: "^#[0-9a-f]{6}$" }
        yaziTipi: { type: string, enum: [sistem, serif, yuvarlak, mono] }
        kose: { type: integer, minimum: 0, maximum: 32 }
    TanitimAdimi:
      type: object
      additionalProperties: false
      required: [id, tur, baslik, metin, dugme]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [tanitim] }
        gorsel: { $ref: "#/components/schemas/GorselKimligi" }
        gorselMetni: { $ref: "#/components/schemas/GorselMetni" }
        baslik: { type: string }
        metin: { type: string }
        dugme: { type: string }
        hedef: { $ref: "#/components/schemas/AdimHedefi" }
        ilerlemeGoster: { type: boolean }
    SoruAdimi:
      type: object
      additionalProperties: false
      required: [id, tur, soru]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [soru] }
        soru: { type: string }
        aciklama: { type: string, maxLength: 500 }
        ilerlemeGoster: { type: boolean }
        secimTuru: { type: string, enum: [tekli, coklu, metin] }
        yanitZorunlu: { type: boolean }
        devamDugmesi: { type: string }
        secenekler:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, metin]
            properties:
              id: { $ref: "#/components/schemas/HuniKimligi" }
              metin: { type: string }
              gorsel: { $ref: "#/components/schemas/GorselKimligi" }
              gorselMetni: { $ref: "#/components/schemas/GorselMetni" }
              hedef: { $ref: "#/components/schemas/AdimHedefi" }
    YorumAdimi:
      description: Sosyal kanıt yorumu ve kaynak adı; kullanıcı metni düz yazı olarak gösterilir
      type: object
      additionalProperties: false
      required: [id, tur, baslik, metin, yazar, unvan, dugme]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [yorum] }
        baslik: { type: string, minLength: 1, maxLength: 200 }
        metin: { type: string, maxLength: 1000 }
        yazar: { type: string, minLength: 1, maxLength: 80 }
        unvan: { type: string, maxLength: 100 }
        dugme: { type: string, minLength: 1, maxLength: 60 }
        ilerlemeGoster: { type: boolean }
    AdimHedefi:
      description: >-
        H5 dallanma: bu düğme / seçenek sıradaki adım yerine bu kimlikli adıma
        gider. Yalnız İLERİ (tanımda daha sonraki bir adım) — döngü olamaz.
        Yoksa sıradaki adım.
      allOf: [{ $ref: "#/components/schemas/HuniKimligi" }]
    PaywallAdimi:
      type: object
      additionalProperties: false
      required: [id, tur, baslik, metin, dugme, plan]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [paywall] }
        baslik: { type: string }
        metin: { type: string }
        dugme: { type: string }
        ilerlemeGoster: { type: boolean }
        plan: { type: string, enum: [monthly] }
        faydalar:
          description: "Ç61: paywall'da madde madde fayda listesi (isteğe bağlı)"
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        sartlar: { $ref: "#/components/schemas/YasalAdres" }
        gizlilik: { $ref: "#/components/schemas/YasalAdres" }
        iptal: { $ref: "#/components/schemas/YasalAdres" }
    YasalAdres:
      description: >-
        Ç61: kullanım şartları / gizlilik / iptal sayfası. Yalnız https —
        javascript: gibi şemalar huni sayfasında betik çalıştırırdı.
      type: string
      pattern: "^https://[^\\s]{1,490}$"
    GorselMetni:
      description: "Ç44: görselin alt metni (yalnız görselle); yoksa görsel dekoratif sayılır (alt boş)"
      type: string
      minLength: 1
      maxLength: 200
    GorselKimligi:
      description: "Görsel kimliği (WebP'nin SHA-256'sı); dosya GET /medya/{id}.webp (E2.3)"
      type: string
      pattern: "^[0-9a-f]{64}$"
    HuniKimligi:
      description: Huni tanımındaki adım / soru / seçenek kimliği (funnel/src/huniler/)
      type: string
      pattern: "^[a-z0-9_-]{1,64}$"
    Hata:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [unknown_app, unknown_plan, payment_provider_unavailable, unauthorized, invalid_request, invalid_code, expired_code, too_many_attempts, too_many_requests, unknown_user, unknown_visit, forbidden, not_ready, link_window_closed, invalid_token, expired_token]
