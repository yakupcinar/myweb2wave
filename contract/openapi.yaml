        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama ya da deney, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: "Geçiş yok, huni yayında değil ya da hunide zaten aktif yönlendirme deneyi var", content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/deneyler/{ad}/sonuclar:
