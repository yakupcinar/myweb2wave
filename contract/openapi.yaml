                ad: { $ref: "#/components/schemas/HuniKimligi" }
                tur: { type: string, enum: [yonlendirme, icerik] }
                huni: { $ref: "#/components/schemas/HuniKimligi" }
                varyantlar: { type: array, minItems: 2, maxItems: 4, items: { $ref: "#/components/schemas/DeneyVaryanti" } }
