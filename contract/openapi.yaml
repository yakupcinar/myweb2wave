      additionalProperties: false
      required: [ekUrunler]
      properties:
        ekUrunler:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [anahtar, ad, stripeFiyat, fiyat]
            properties:
              anahtar: { type: string }
              ad: { type: string }
              stripeFiyat: { type: string }
              fiyat:
                description: Stripe'tan; okunamazsa null
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [tutar, paraBirimi]
                    properties:
                      tutar: { type: number }
                      paraBirimi: { type: string }
