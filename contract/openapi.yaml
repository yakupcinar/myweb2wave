      operationId: panelApiDeneySonuclari
      summary: "M4b — varyant başına ziyaret, ödemeye geçen, abone olan (deneme dahil), ödeyen; abone olma oranının kazanma olasılığı"
      responses:
        "200": { description: Sonuçlar, content: { application/json: { schema: { $ref: "#/components/schemas/PanelDeneySonuclari" } } } }
        "404": { description: Bilinmeyen uygulama ya da deney, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/planlar/{anahtar}/para-birimleri:
