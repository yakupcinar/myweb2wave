                anahtar: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
                ad: { type: string, minLength: 1, maxLength: 100 }
                tutar: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
                paraBirimi: { type: string, enum: [EUR, USD, GBP, TRY] }
      responses:
        "201": { description: Oluştu; güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelEkUrunleri" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz alan ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/webhooklar:
