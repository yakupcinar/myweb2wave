            tur: { type: string, enum: [deneme] }
            gun: { type: integer, minimum: 1, maximum: 90 }
            bitis: { $ref: "#/components/schemas/TeklifBitisi" }
        - type: object
          additionalProperties: false
          required: [tur, gun, tutar]
          properties:
            tur: { type: string, enum: [giris] }
            gun: { type: integer, minimum: 1, maximum: 90 }
            tutar: { type: number, description: "Ana birimde, planın para biriminde" }
            bitis: { $ref: "#/components/schemas/TeklifBitisi" }
        - type: object
          additionalProperties: false
          required: [tur, yuzde]
          properties:
            tur: { type: string, enum: [indirim] }
            yuzde: { type: integer, minimum: 1, maximum: 99 }
            bitis: { $ref: "#/components/schemas/TeklifBitisi" }
