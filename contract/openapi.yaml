          type: array
          items:
            type: object
            additionalProperties: false
            required: [ad, ziyaret, odemeyeGecti, abone, odedi, kazanmaOlasiligi]
            properties:
              ad: { type: string }
              ziyaret: { type: integer, minimum: 0, description: Varyanta atanan ziyaret }
              odemeyeGecti: { type: integer, minimum: 0, description: Ödeme oturumu açan ziyaret }
              abone: { type: integer, minimum: 0, description: "Abonelik başladı (kartlı deneme dahil) — dönüşüm" }
              odedi: { type: integer, minimum: 0, description: "Para çekildi — oturum tutarı > 0 ya da tahsil edilmiş fatura, deneme sonrası ilk ödeme dahil (Stripe kartlı denemeyi de paid sayar, tutar 0)" }
              kazanmaOlasiligi: { type: number, minimum: 0, maximum: 1, description: "Abone olma oranı en yüksek olma olasılığı (Beta(1,1) önsel)" }
