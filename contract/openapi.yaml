  /panel/api/uygulamalar/{app}/planlar:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
    get:
      operationId: panelApiPlanlar
      summary: Fiyat kataloğu (M1a) — tutar Stripe'tan
      responses:
        "200": { description: Planlar, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
    post:
      operationId: panelApiPlanOlustur
      summary: Yeni plan — Stripe'ta ürün + yinelenen fiyat açılır
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [anahtar, ad, tutar, paraBirimi, aralik]
              properties:
                anahtar: { $ref: "#/components/schemas/PlanAnahtari" }
                ad: { type: string, minLength: 1, maxLength: 100 }
                tutar: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000, description: Ana birimde (9.99) }
                paraBirimi: { type: string, enum: [EUR, USD, GBP, TRY] }
                aralik: { type: string, enum: [week, month, year] }
      responses:
        "201": { description: Oluşturuldu; güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz alan, plan zaten var ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/planlar/{anahtar}/fiyat:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: anahtar, in: path, required: true, schema: { type: string } }
    put:
      operationId: panelApiPlanFiyati
      summary: Yeni tutar — aynı üründe yeni Stripe fiyatı; eski fiyat satıştan kalkar, mevcut aboneler onda kalır
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tutar]
              properties:
                tutar: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
      responses:
        "200": { description: Güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama ya da plan, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz tutar ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/planlar/{anahtar}/teklif:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: anahtar, in: path, required: true, schema: { type: string } }
    put:
      operationId: panelApiPlanTeklifi
      summary: M1b — planın teklifini koyar, değiştirir ya da kaldırır (tur null); mevcut aboneler etkilenmez
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tur]
              properties:
                tur: { type: [string, "null"], enum: [deneme, giris, indirim, null] }
                gun: { type: integer, minimum: 1, maximum: 90 }
                tutar: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
                yuzde: { type: integer, minimum: 1, maximum: 99 }
      responses:
        "200": { description: Güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama ya da plan, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz teklif ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
components:
  securitySchemes:
    uygulamaAnahtari:
      type: http
      scheme: bearer
      description: Uygulama başına gizli anahtar; YALNIZ uygulamanın sunucusunda (A5)
  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { type: string }
  responses:
    Yetkisiz:
      description: Anahtar yok, yanlış ya da başka uygulamanın
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
    IstekHatasi:
      description: Geçersiz alan ya da kod
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
  schemas:
    ApiAnahtari:
      type: object
      additionalProperties: false
      required: [id, ad, onek, olusturma, sonKullanim, iptal]
      properties:
        id: { type: integer }
        ad: { type: string }
        onek: { type: string, description: "Anahtarın ilk 11 karakteri (mw2w_xxxxxx) — tanımak için" }
        olusturma: { type: string }
        sonKullanim: { type: [string, "null"] }
        iptal: { type: boolean }
    UrunBaglami:
      description: "A4: yöneticinin yazdığı ürün tanımı; AI metinleri buna göre yazar"
      type: object
      additionalProperties: false
      required: [urun, kategori, kitle, ton, yasaklar]
      properties:
        urun: { type: string, maxLength: 1000, description: Ürün ne yapıyor }
        kategori: { type: string, maxLength: 100 }
        kitle: { type: string, maxLength: 500, description: Hedef kitle }
        ton: { type: string, maxLength: 200, description: Metinlerin tonu }
        yasaklar: { type: string, maxLength: 1000, description: Asla yazılmayacaklar / kaçınılacaklar }
    PanelHatalari:
      type: object
      additionalProperties: false
      required: [hatalar]
      properties:
        hatalar: { type: array, items: { type: string } }
    PanelAiDurumu:
      type: object
      additionalProperties: false
      required: [acik, model]
      properties:
        acik: { type: boolean }
        model: { type: string }
    PanelAiOlayi:
      description: "SSE olayının data alanı; tur, event satırıyla aynı"
      oneOf:
        - { type: object, additionalProperties: false, required: [tur, metin], properties: { tur: { type: string, enum: [metin] }, metin: { type: string } } }
        - { type: object, additionalProperties: false, required: [tur, ad], properties: { tur: { type: string, enum: [arac] }, ad: { type: string } } }
        - { type: object, additionalProperties: false, required: [tur, ad, hata], properties: { tur: { type: string, enum: [arac_sonucu] }, ad: { type: string }, hata: { type: boolean } } }
        - type: object
          additionalProperties: false
          required: [tur, imza, tanim]
          properties:
            tur: { type: string, enum: [taslak] }
            imza: { type: [string, "null"] }
            tanim: { $ref: "#/components/schemas/HuniTanimi" }
        - { type: object, additionalProperties: false, required: [tur, mesaj], properties: { tur: { type: string, enum: [hata] }, mesaj: { type: string } } }
        - type: object
          additionalProperties: false
          required: [tur, sonuc, kaydedildi, tur_sayisi, maliyetMikrodolar]
          properties:
            tur: { type: string, enum: [bitti] }
            sonuc: { type: string, enum: [tamam, tur_siniri, reddedildi, jeton_siniri, hata] }
            kaydedildi: { type: boolean }
            tur_sayisi: { type: integer, minimum: 0 }
            maliyetMikrodolar: { type: [integer, "null"] }
    PanelSayimi:
      type: object
      additionalProperties: false
      required: [ziyaret, odemeye_gecti, odedi]
      properties:
        ziyaret: { type: integer, minimum: 0 }
        odemeye_gecti: { type: integer, minimum: 0 }
        odedi: { type: integer, minimum: 0 }
    PanelRaporu:
      type: object
      additionalProperties: false
      required: [gun, gunler, azami, sayimlar, izinler, satirlar, adimlar, cevaplar, metinCevaplari, gunluk]
      properties:
        gun: { type: integer, enum: [7, 30, 90] }
        gunluk:
          description: P4 — aralığın her UTC günü (en eski önce), boş gün 0; olay deposundan (T4)
          type: array
          items:
            type: object
            additionalProperties: false
            required: [gun, ziyaret, odemeBaslatildi, odemeTamamlandi]
            properties:
              gun: { type: string, format: date }
              ziyaret: { type: integer, minimum: 0 }
              odemeBaslatildi: { type: integer, minimum: 0 }
              odemeTamamlandi: { type: integer, minimum: 0 }
        gunler:
          type: array
          items: { type: integer, enum: [7, 30, 90] }
        azami:
          description: Satır listelerinin üst sınırı (en yeni N); sayımlar tüm aralığı kapsar
          type: integer
        sayimlar:
          type: object
          additionalProperties: false
          required: [reklam, organik]
          properties:
            reklam: { $ref: "#/components/schemas/PanelSayimi" }
            organik: { $ref: "#/components/schemas/PanelSayimi" }
        izinler:
          description: Ç56 (3) — yalnız sayı, kim olduğu yok
          type: object
          additionalProperties: false
          required: [kabul, red, secmeyen]
          properties:
            kabul: { type: integer, minimum: 0 }
            red: { type: integer, minimum: 0 }
            secmeyen: { type: integer, minimum: 0 }
        satirlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, huni, kaynak, kampanya, reklam, asama, durum, email]
            properties:
              zaman: { type: string }
              app: { type: string }
              huni: { type: [string, "null"] }
              kaynak: { type: string }
              kampanya: { type: [string, "null"] }
              reklam: { type: boolean }
              asama: { type: string, enum: ["sayfayı gördü", "ödemeye geçti", "ödedi"] }
              durum: { type: [string, "null"] }
              email:
                description: Maskeli (a***@example.com); açık e-posta panele hiç gelmez
                type: [string, "null"]
        adimlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, huni, sira, adim, ulasan]
            properties:
              app: { type: string }
              huni: { type: string }
              sira: { type: integer, minimum: 0 }
              adim: { type: string }
              ulasan: { type: integer, minimum: 0 }
        cevaplar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, soru, secenek, sayi]
            properties:
              app: { type: string }
              soru: { type: string }
              secenek: { type: string }
              sayi: { type: integer, minimum: 0 }
        metinCevaplari:
          description: 90 gün içinde, en yeni azami kadar
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, soru, cevap]
            properties:
              zaman: { type: string }
              app: { type: string }
              soru: { type: string }
              cevap: { type: string }
    AtifAlani:
      type: string
      maxLength: 500
    HuniYayini:
      type: object
      additionalProperties: false
      required: [huni, surum, tanim]
      properties:
        huni: { $ref: "#/components/schemas/HuniKimligi" }
        surum: { type: [integer, "null"], description: Yayınlanmış sürüm; taslakta null }
        tanim: { $ref: "#/components/schemas/HuniTanimi" }
        fiyatlar:
          description: >-
            Ç19/Ç21: plan → Stripe fiyatı (tek kaynak). Stripe'a ulaşılamazsa
            ya da fiyat tek aralıklı yinelenen değilse yok — paywall yalnız
            metnini gösterir.
          type: object
          additionalProperties: { $ref: "#/components/schemas/PlanFiyati" }
    PlanAnahtari:
      description: "M1a: fiyat kataloğundaki planın anahtarı (panel → Planlar); çekirdek uygulamanın planlarına karşı doğrular"
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    PanelPlanlari:
      type: object
      additionalProperties: false
      required: [planlar]
      properties:
        planlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [anahtar, ad, stripeFiyat, fiyat]
            properties:
              anahtar: { $ref: "#/components/schemas/PlanAnahtari" }
              ad: { type: string }
              stripeFiyat: { type: string }
              fiyat:
                description: Stripe'tan; okunamazsa null
                oneOf: [{ $ref: "#/components/schemas/PlanFiyati" }, { type: "null" }]
    PlanFiyati:
      type: object
      additionalProperties: false
      required: [tutar, paraBirimi, aralik]
      properties:
        tutar: { type: number, description: Ana birimde (9.99) }
        paraBirimi: { type: string, pattern: "^[A-Z]{3}$" }
        aralik: { type: string, enum: [day, week, month, year] }
        teklif: { $ref: "#/components/schemas/PlanTeklifi" }
    PlanTeklifi:
      description: >-
        M1b: planın giriş teklifi (en çok bir). deneme = kartlı ücretsiz gün;
        giris = gün + o gün ödenen tek seferlik ücret (planın para biriminde,
        Stripe'tan); indirim = ilk dönem yüzde. Gösterilemiyorsa planın fiyatı
        da yanıtta yoktur.
      oneOf:
        - type: object
          additionalProperties: false
          required: [tur, gun]
          properties:
            tur: { type: string, enum: [deneme] }
            gun: { type: integer, minimum: 1, maximum: 90 }
        - type: object
          additionalProperties: false
          required: [tur, gun, tutar]
          properties:
            tur: { type: string, enum: [giris] }
            gun: { type: integer, minimum: 1, maximum: 90 }
            tutar: { type: number, description: "Ana birimde, planın para biriminde" }
        - type: object
          additionalProperties: false
          required: [tur, yuzde]
          properties:
            tur: { type: string, enum: [indirim] }
            yuzde: { type: integer, minimum: 1, maximum: 99 }
    HuniTanimi:
      description: Çekirdekte core/src/Huni/Tanim.php doğrular; metinler düz metin (HTML yok)
      type: object
      additionalProperties: false
      required: [sayfaBasligi, adimlar]
      properties:
        sayfaBasligi: { type: string, minLength: 1, maxLength: 120 }
        tema: { $ref: "#/components/schemas/HuniTemasi" }
        logo:
          description: "Ç61: sayfanın başındaki logo (isteğe bağlı, temadan bağımsız)"
          allOf: [{ $ref: "#/components/schemas/GorselKimligi" }]
        adimlar:
          type: array
          minItems: 2
          maxItems: 50
          items:
            oneOf:
              - $ref: "#/components/schemas/YuklemeAdimi"
              - $ref: "#/components/schemas/EkranAdimi"
              - $ref: "#/components/schemas/PaywallAdimi"
    HuniTemasi:
      description: "Huni başına görünüm (E2.2); çekirdekte core/src/Huni/Tema.php doğrular (kontrast dahil)"
      type: object
      additionalProperties: false
      required: [anaRenk, arkaPlan, metinRengi, yaziTipi, kose]
      properties:
        anaRenk: { type: string, pattern: "^#[0-9a-f]{6}$" }
        arkaPlan: { type: string, pattern: "^#[0-9a-f]{6}$" }
        metinRengi: { type: string, pattern: "^#[0-9a-f]{6}$" }
        yaziTipi:
          description: "sistem/mono cihaz yazı tipi; serif (Lora), yuvarlak (Nunito), modern (Manrope), geometrik (Outfit) huniyle birlikte sunulur (G2)"
          type: string
          enum: [sistem, serif, yuvarlak, mono, modern, geometrik]
        kose: { type: integer, minimum: 0, maximum: 32 }
        baslikBoyu:
          description: "G7: başlık ölçeği (yoksa normal): kucuk 24px · normal 28px · buyuk 36px"
          type: string
          enum: [kucuk, normal, buyuk]
        yogunluk:
          description: "G7: boşluk yoğunluğu (yoksa normal): sik · normal · ferah"
          type: string
          enum: [sik, normal, ferah]
        dugmeBicimi:
          description: "G4: ana düğme (yoksa dolu): dolu · cerceve (saydam, ana renk çizgi ve yazı — ana renk düğmenin altındaki yüzeyde 4,5:1 okunmalı) · hap (tam yuvarlak)"
          type: string
          enum: [dolu, cerceve, hap]
        hizalama:
          description: "G7: başlık ve açıklama hizası (yoksa sol)"
          type: string
          enum: [sol, orta]
        hareket:
          description: "V4: hareket düzeyi (yoksa sakin): yok (geçiş ve düğme hareketi yok) · sakin (kısa kayma) · canli (sırayla giriş, seçim efekti, sayan istatistik); hareketi azaltmayı seçen ziyaretçiye hiç uygulanmaz"
          type: string
          enum: [yok, sakin, canli]
        simgeler:
          description: "V3a: emoji simgeleri (yoksa cihaz): cihaz (telefonun emojisi) · renkli (Fluent 3B, her cihazda aynı) · tekrenk (Fluent tek renk, ana renkte)"
          type: string
          enum: [cihaz, renkli, tekrenk]
        kartRengi:
          description: "G6: içerik zeminin üstünde bu renkte kartta durur (isteğe bağlı). Varsa metin kartın üstündedir: okunurluk metinRengi ↔ kartRengi ölçülür, zemin yalnız çevrede kalır"
          type: string
          pattern: "^#[0-9a-f]{6}$"
        zemin:
          description: "G3: düz arka plan yerine geçiş ya da görsel (isteğe bağlı). Metin her durumda okunmalı — çekirdek ölçer"
          oneOf:
            - $ref: "#/components/schemas/ZeminGecisi"
            - $ref: "#/components/schemas/ZeminGorseli"
    ZeminGecisi:
      description: "Yukarıdan aşağı arkaPlan → ikinciRenk; metin ikinciRenk üstünde de 4,5:1"
      type: object
      additionalProperties: false
      required: [tur, ikinciRenk]
      properties:
        tur: { type: string, enum: [gecis] }
        ikinciRenk: { type: string, pattern: "^#[0-9a-f]{6}$" }
    ZeminGorseli:
      description: "Görsel kaplar, üstünde arkaPlan renginde yarı saydam katman (karartma %). Karartma, görsel en kötü durumda (tam siyah ya da tam beyaz) olsa da metni 4,5:1 okutacak kadar olmalı"
      type: object
      additionalProperties: false
      required: [tur, gorsel, karartma]
      properties:
        tur: { type: string, enum: [gorsel] }
        gorsel: { $ref: "#/components/schemas/GorselKimligi" }
        karartma: { type: integer, minimum: 0, maximum: 95 }
    SoruSecenegi:
      type: object
      additionalProperties: false
      required: [id, metin]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        metin: { type: string }
        simge:
          description: "Seçenekte metnin önünde tek emoji (isteğe bağlı; görselle birlikte olmaz). Ekran okuyucuya okunmaz — anlam metinde olmalı"
          type: string
          maxLength: 32
        gorsel: { $ref: "#/components/schemas/GorselKimligi" }
        gorselMetni: { $ref: "#/components/schemas/GorselMetni" }
        hedef: { $ref: "#/components/schemas/AdimHedefi" }
    YuklemeAdimi:
      description: "Mobil görünüm 4: \"planın hazırlanıyor\" — düğmesiz; maddeler sırayla işaretlenir, süre dolunca sonraki adıma kendiliğinden geçer"
      type: object
      additionalProperties: false
      required: [id, tur, baslik]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [yukleme] }
        baslik: { type: string, minLength: 1, maxLength: 200 }
        maddeler:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 80 }
        sure: { type: integer, minimum: 2, maximum: 10, description: "saniye (yoksa 4)" }
        ilerlemeGoster: { type: boolean }
    EkranAdimi:
      description: >-
        T1: üstte başlık (sayfanın başlığı), altında katalogdaki bloklar
        yukarıdan aşağı (baslik bloğu ara başlıktır), altta tek ana düğme.
      type: object
      additionalProperties: false
      required: [id, tur, baslik, bloklar]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [ekran] }
        baslik: { type: string, minLength: 1, maxLength: 200 }
        gorsel:
          description: "T1c: kapak — başlığın üstünde (isteğe bağlı)"
          allOf: [{ $ref: "#/components/schemas/GorselKimligi" }]
        gorselMetni: { $ref: "#/components/schemas/GorselMetni" }
        duzen:
          description: "Kapağın yeri (yoksa ust): kahraman ekranın üst yarısı · tamEkran bütün ekran, metin beyaz — tam ekranda yalnız baslik, metin, maddeler, istatistik blokları. kahraman ve tamEkran görsel ister"
          type: string
          enum: [ust, kahraman, tamEkran]
        bloklar:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/EkranBlogu" }
        dugme:
          description: "Zorunlu — yalnız tek seçimli soru bloğu olan ekranda yok (seçenek seçilince geçer; hedef de seçenekte)"
          type: string
          minLength: 1
          maxLength: 60
        hedef: { $ref: "#/components/schemas/AdimHedefi" }
        yonlendirme:
          description: >-
            T3a: koşullu yönlendirme — ekrandan çıkarken ilk tutan kuralın
            hedefine gidilir; hiçbiri tutmazsa seçeneğin hedefi, sonra ekranın
            hedefi, sonra sıradaki adım.
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/Yonlendirme" }
        goster:
          description: >-
            T3b: koşullu gösterim — koşul tutmazsa ekran atlanır, sıradaki
            adıma geçilir. Cevap yalnız önceki adımlardan; ilk adımda olmaz.
          $ref: "#/components/schemas/KosulGrubu"
        degerler:
          description: >-
            T3c: koşullu değer — ekranın baslik, dugme, gorsel, gorselMetni
            alanı kurala bağlanır (öğede var olmalı).
          $ref: "#/components/schemas/KosulluDegerler"
        ilerlemeGoster: { type: boolean }
    Yonlendirme:
      type: object
      additionalProperties: false
      required: [kosullar, hedef]
      properties:
        baglac:
          description: "hepsi (VE, varsayılan) · herhangi (VEYA)"
          type: string
          enum: [hepsi, herhangi]
        kosullar:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Kosul" }
        hedef: { $ref: "#/components/schemas/AdimHedefi" }
    PanelHunileri:
      type: object
      additionalProperties: false
      required: [adres, parametreler, huniler, kurallar, sablonlar]
      properties:
        adres: { type: string, description: Uygulamanın tek reklam adresi }
        parametreler: { type: array, items: { type: string }, description: Kuralda kullanılabilen adres parametreleri }
        huniler:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ad, varsayilan, yayinda, farkli, ziyaretli, ac, duzenle]
            properties:
              ad: { type: string }
              varsayilan: { type: boolean }
              yayinda: { type: [integer, "null"], description: Son yayın sürümü; hiç yayınlanmadıysa null }
              farkli: { type: boolean, description: Taslakta yayınlanmamış değişiklik var }
              ziyaretli: { type: boolean, description: Ziyareti var — kaldırma arşivler (Ç41) }
              ac: { type: string, description: "Ç70: süreli önizleme (yayınlanmışsa yayındaki sürüm), ziyaret sayılmaz" }
              duzenle: { type: string }
        kurallar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, sira, parametre, deger, huni]
            properties:
              id: { type: integer }
              sira: { type: integer }
              parametre: { type: string }
              deger: { type: string }
              huni: { type: string }
        sablonlar:
          type: array
          description: "V6: niş şablonları (core/config/huni/sablonlar) — yeni huninin başlangıcı"
          items:
            type: object
            additionalProperties: false
            required: [anahtar, ad, aciklama]
            properties:
              anahtar: { type: string }
              ad: { type: string }
              aciklama: { type: string }
    KosulluDegerler:
      description: >-
        T3c: kural = koşullar + bir alanın yeni değeri; aynı alanda ilk tutan
        kural kazanır, hiçbiri tutmazsa alanın kendi değeri. Gösterimde
        hesaplanır: cevap yalnız önceki adımlardan. Soru ve maddeler
        bloğunda yok.
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required: [kosullar, alan, deger]
        properties:
          baglac:
            type: string
            enum: [hepsi, herhangi]
          kosullar:
            type: array
            minItems: 1
            maxItems: 5
            items: { $ref: "#/components/schemas/Kosul" }
          alan: { type: string, minLength: 1, maxLength: 40 }
          deger: { type: string, minLength: 1, maxLength: 1000 }
    KosulGrubu:
      type: object
      additionalProperties: false
      required: [kosullar]
      properties:
        baglac:
          description: "hepsi (VE, varsayılan) · herhangi (VEYA)"
          type: string
          enum: [hepsi, herhangi]
        kosullar:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Kosul" }
    Kosul:
      description: >-
        T2 özellik sözlüğünden bir ad (huni, huni.surum, utm.*, izin.reklam,
        cevap.<adım>, adim.son; ödeme/abonelik hunide bilinmez). Seçmeli
        cevap listedir: icerir / icermez (değer seçenek kimliği). Tek
        değerler: esit / esit_degil. Her özellik: var / yok (değersiz).
      type: object
      additionalProperties: false
      required: [ozellik, islem]
      properties:
        ozellik: { type: string, minLength: 1, maxLength: 80 }
        islem: { type: string, enum: [esit, esit_degil, icerir, icermez, var, yok] }
        deger:
          oneOf:
            - { type: string, minLength: 1, maxLength: 200 }
            - { type: integer }
    EkranBlogu:
      description: "T1 blok kataloğu; metinler düz metin"
      oneOf:
        - $ref: "#/components/schemas/BaslikBlogu"
        - $ref: "#/components/schemas/MetinBlogu"
        - $ref: "#/components/schemas/GorselBlogu"
        - $ref: "#/components/schemas/MaddelerBlogu"
        - $ref: "#/components/schemas/YorumBlogu"
        - $ref: "#/components/schemas/IstatistikBlogu"
        - $ref: "#/components/schemas/KutuBlogu"
        - $ref: "#/components/schemas/GrafikBlogu"
        - $ref: "#/components/schemas/OnceSonraBlogu"
        - $ref: "#/components/schemas/SoruBlogu"
    BaslikBlogu:
      description: Ara başlık
      type: object
      additionalProperties: false
      required: [tur, metin]
      properties:
        tur: { type: string, enum: [baslik] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        metin: { type: string, minLength: 1, maxLength: 200 }
    MetinBlogu:
      description: Paragraf
      type: object
      additionalProperties: false
      required: [tur, metin]
      properties:
        tur: { type: string, enum: [metin] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        metin: { type: string, minLength: 1, maxLength: 1000 }
    GorselBlogu:
      type: object
      additionalProperties: false
      required: [tur, gorsel]
      properties:
        tur: { type: string, enum: [gorsel] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        gorsel: { $ref: "#/components/schemas/GorselKimligi" }
        gorselMetni: { $ref: "#/components/schemas/GorselMetni" }
    MaddelerBlogu:
      description: İşaretli madde listesi (fayda, özellik)
      type: object
      additionalProperties: false
      required: [tur, maddeler]
      properties:
        tur: { type: string, enum: [maddeler] }
        maddeler:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
    YorumBlogu:
      description: Kısa müşteri yorumu; puan varsa yıldızla gösterilir
      type: object
      additionalProperties: false
      required: [tur, metin, yazar]
      properties:
        tur: { type: string, enum: [yorum] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        metin: { type: string, minLength: 1, maxLength: 1000 }
        yazar: { type: string, minLength: 1, maxLength: 80 }
        unvan: { type: string, maxLength: 100 }
        puan: { type: integer, minimum: 1, maximum: 5 }
    IstatistikBlogu:
      description: "Büyük değer + açıklama (\"%87\" · \"kullanıcı ilk hafta düzenli kullanıyor\"). Değer gerçek olmalı — uydurma sayı yanıltıcı reklamdır"
      type: object
      additionalProperties: false
      required: [tur, deger, metin]
      properties:
        tur: { type: string, enum: [istatistik] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        deger: { type: string, minLength: 1, maxLength: 12 }
        metin: { type: string, minLength: 1, maxLength: 120 }
    GrafikBlogu:
      description: "V5: projeksiyon eğrisi (ana renkte) — sayı yok, yalnız uç etiketleri; sonuç vaadi değil, yolun resmi"
      type: object
      additionalProperties: false
      required: [tur, baslangic, hedef]
      properties:
        tur: { type: string, enum: [grafik] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        baslangic: { type: string, minLength: 1, maxLength: 40 }
        hedef: { type: string, minLength: 1, maxLength: 40 }
        egri: { type: string, enum: [artan, azalan], description: "Yoksa artan" }
    OnceSonraBlogu:
      description: "V5: önce/sonra — iki yüklenmiş görsel yan yana; etiketler alt metin de olur"
      type: object
      additionalProperties: false
      required: [tur, once, sonra, onceEtiketi, sonraEtiketi]
      properties:
        tur: { type: string, enum: [onceSonra] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        once: { $ref: "#/components/schemas/GorselKimligi" }
        sonra: { $ref: "#/components/schemas/GorselKimligi" }
        onceEtiketi: { type: string, minLength: 1, maxLength: 40 }
        sonraEtiketi: { type: string, minLength: 1, maxLength: 40 }
    KutuBlogu:
      description: "Vurgulu not kutusu (güvence, ipucu); simge tek emoji, ekran okuyucuya okunmaz"
      type: object
      additionalProperties: false
      required: [tur, metin]
      properties:
        tur: { type: string, enum: [kutu] }
        degerler: { $ref: "#/components/schemas/KosulluDegerler" }
        metin: { type: string, minLength: 1, maxLength: 500 }
        simge: { type: string, maxLength: 32 }
    SoruBlogu:
      description: >-
        T1b: ekranda en çok bir tane; cevap ekranın kimliğiyle kaydedilir.
        Soru metni ekranın başlığı / blokları. tekli: seçenek seçilince geçer
        (ekranda dugme olmaz). coklu / metin: ekranın düğmesi gönderir.
      type: object
      additionalProperties: false
      required: [tur]
      properties:
        tur: { type: string, enum: [soru] }
        secimTuru: { type: string, enum: [tekli, coklu, metin, eposta, olcek] }
        duzen: { type: string, enum: [liste, izgara] }
        yanitZorunlu: { type: boolean, description: "Yalnız metin ve eposta" }
        olcekSol: { type: string, minLength: 1, maxLength: 40, description: "Yalnız olcek: 1'in etiketi (ör. Hiç katılmıyorum)" }
        olcekSag: { type: string, minLength: 1, maxLength: 40, description: "Yalnız olcek: 5'in etiketi (ör. Tamamen katılıyorum)" }
        izinMetni:
          type: string
          minLength: 1
          maxLength: 200
          description: "Yalnız eposta: pazarlama izni kutusunun metni (yoksa kutu yok, izin alınmaz)"
        secenekler:
          description: "Seçmelide zorunlu (2–8), serbest yanıtta yok"
          type: array
          items: { $ref: "#/components/schemas/SoruSecenegi" }
    AdimHedefi:
      description: >-
        H5 dallanma: bu düğme / seçenek sıradaki adım yerine bu kimlikli adıma
        gider. Yalnız İLERİ (tanımda daha sonraki bir adım) — döngü olamaz.
        Yoksa sıradaki adım.
      allOf: [{ $ref: "#/components/schemas/HuniKimligi" }]
    PaywallAdimi:
      type: object
      additionalProperties: false
      required: [id, tur, baslik, metin, dugme, plan]
      properties:
        id: { $ref: "#/components/schemas/HuniKimligi" }
        tur: { type: string, enum: [paywall] }
        baslik: { type: string }
        metin: { type: string }
        dugme: { type: string }
        ilerlemeGoster: { type: boolean }
        plan: { $ref: "#/components/schemas/PlanAnahtari" }
        faydalar:
          description: "Ç61: paywall'da madde madde fayda listesi (isteğe bağlı)"
          type: array
          minItems: 1
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        sartlar: { $ref: "#/components/schemas/YasalAdres" }
        gizlilik: { $ref: "#/components/schemas/YasalAdres" }
        iptal: { $ref: "#/components/schemas/YasalAdres" }
    YasalAdres:
      description: >-
        Ç61: kullanım şartları / gizlilik / iptal sayfası. Yalnız https —
        javascript: gibi şemalar huni sayfasında betik çalıştırırdı.
      type: string
      pattern: "^https://[^\\s]{1,490}$"
    GorselMetni:
      description: "Ç44: görselin alt metni (yalnız görselle); yoksa görsel dekoratif sayılır (alt boş)"
      type: string
      minLength: 1
      maxLength: 200
    GorselKimligi:
      description: "Görsel kimliği (WebP'nin SHA-256'sı); dosya GET /medya/{id}.webp (E2.3)"
      type: string
      pattern: "^[0-9a-f]{64}$"
    HuniKimligi:
      description: Huni tanımındaki adım / soru / seçenek kimliği (funnel/src/huniler/)
      type: string
      pattern: "^[a-z0-9_-]{1,64}$"
    Hata:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [unknown_app, unknown_plan, payment_provider_unavailable, unauthorized, invalid_request, invalid_code, expired_code, too_many_attempts, too_many_requests, unknown_user, unknown_visit, forbidden, not_ready, link_window_closed, invalid_token, expired_token]
