              ad: { type: string }
              tur: { type: string, enum: [yonlendirme, icerik] }
              huni: { type: string }
              varyantlar: { type: array, items: { $ref: "#/components/schemas/DeneyVaryanti" } }
              durum: { type: string, enum: [taslak, aktif, durdu, bitti] }
              baslangic: { type: [string, "null"], description: İlk aktif oluş (UTC) }
              bitis: { type: [string, "null"], description: Bitiş (UTC) }
    PanelDeneySonuclari:
      type: object
      additionalProperties: false
      required: [ad, durum, varyantlar]
      properties:
        ad: { type: string }
        durum: { type: string, enum: [taslak, aktif, durdu, bitti] }
