        bekleyen: { type: integer, minimum: 0 }
        teslim: { type: integer, minimum: 0 }
        vazgecildi: { type: integer, minimum: 0 }
    PanelTutar:
      description: Ana birimde tutar (9.99), para birimi başına — çevrilmez
