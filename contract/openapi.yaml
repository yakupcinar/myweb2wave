          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tutarlar]
              properties:
                tutarlar:
                  type: object
                  additionalProperties: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
      responses:
        "200": { description: Güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama ya da plan, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz tutar, giriş teklifli plan ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
  /panel/api/uygulamalar/{app}/planlar/{anahtar}/teklif:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: anahtar, in: path, required: true, schema: { type: string } }
    put:
      operationId: panelApiPlanTeklifi
      summary: M1b — planın teklifini koyar, değiştirir ya da kaldırır (tur null); mevcut aboneler etkilenmez
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
