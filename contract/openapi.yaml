  /huni/ek-satis:
    post:
      operationId: huniEkSatis
      summary: "M3c — ödeme sonrası tek tık ek ürün; yetki ödenmiş, bu uygulamanın, son 1 saatteki Stripe oturumu; oturum + ürün başına bir satış. 3D Secure gerekirse istemci doğrulayıp aynı isteği yineler"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, oturum, urun]
              properties:
                app: { type: string }
                oturum: { type: string, pattern: "^cs_[A-Za-z0-9_]{1,250}$" }
                urun: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
      responses:
        "200":
          description: Ödendi ya da banka doğrulaması gerekli
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [durum]
                    properties:
                      durum: { type: string, enum: [odendi] }
                  - type: object
                    additionalProperties: false
                    required: [durum, clientSecret, anahtar]
                    properties:
                      durum: { type: string, enum: [dogrulama] }
                      clientSecret: { type: string }
                      anahtar: { type: string }
        "422":
          description: "Geçersiz istek, uygun olmayan oturum, para birimi uyuşmazlığı, kart reddi ya da sürmekte olan satış"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, enum: [invalid_request, unknown_product, unknown_session, session_not_eligible, currency_mismatch, card_declined, in_progress] }
        "502": { description: Stripe'a ulaşılamadı, content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string, enum: [payment_provider_unavailable] } } } } } }
  /panel/api/uygulamalar/{app}/ek-urunler:
