        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tur]
              properties:
                tur: { type: [string, "null"], enum: [deneme, giris, indirim, null] }
                gun: { type: integer, minimum: 1, maximum: 90 }
                tutar: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000 }
                yuzde: { type: integer, minimum: 1, maximum: 99 }
                bitis: { type: string, format: date-time, description: "M2b: isteğe bağlı gerçek bitiş (saat dilimli, gelecekte, ≤ 1 yıl)" }
      responses:
        "200": { description: Güncel liste, content: { application/json: { schema: { $ref: "#/components/schemas/PanelPlanlari" } } } }
        "403": { description: CSRF, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "404": { description: Bilinmeyen uygulama ya da plan, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
        "422": { description: Geçersiz teklif ya da Stripe yanıt vermedi, content: { application/json: { schema: { $ref: "#/components/schemas/PanelHatalari" } } } }
components:
  securitySchemes:
    uygulamaAnahtari:
      type: http
      scheme: bearer
      description: Uygulama başına gizli anahtar; YALNIZ uygulamanın sunucusunda (A5)
  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { type: string }
  responses:
    Yetkisiz:
      description: Anahtar yok, yanlış ya da başka uygulamanın
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
    IstekHatasi:
      description: Geçersiz alan ya da kod
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hata" }
  schemas:
    ApiAnahtari:
      type: object
      additionalProperties: false
      required: [id, ad, onek, olusturma, sonKullanim, iptal, yonetim]
      properties:
        id: { type: integer }
        ad: { type: string }
        onek: { type: string, description: "Anahtarın ilk 11 karakteri (mw2w_xxxxxx) — tanımak için" }
        olusturma: { type: string }
        sonKullanim: { type: [string, "null"] }
        iptal: { type: boolean }
        yonetim: { type: boolean, description: "M7c2 (A21) — MCP'de abonelik ve deney yazma araçları açık" }
    UrunBaglami:
