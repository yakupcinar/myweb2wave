          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, huni, kaynak, kampanya, reklam, asama, durum, email]
            properties:
              zaman: { type: string }
              app: { type: string }
              huni: { type: [string, "null"] }
              kaynak: { type: string }
              kampanya: { type: [string, "null"] }
              reklam: { type: boolean }
              asama: { type: string, enum: ["sayfayı gördü", "ödemeye geçti", "deneme başladı", "ödedi"] }
              durum: { type: [string, "null"] }
              email:
                description: Maskeli (a***@example.com); açık e-posta panele hiç gelmez
                type: [string, "null"]
        adimlar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, huni, sira, adim, ulasan]
            properties:
              app: { type: string }
              huni: { type: string }
              sira: { type: integer, minimum: 0 }
              adim: { type: string }
              ulasan: { type: integer, minimum: 0 }
        cevaplar:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [app, soru, secenek, sayi, abone]
            properties:
              app: { type: string }
              soru: { type: string }
              secenek: { type: string }
              sayi: { type: integer, minimum: 0, description: Bu seçeneği seçen ziyaret }
              abone: { type: integer, minimum: 0, description: "M5c — bunlardan abone olan (deneme dahil)" }
        utm:
          description: "M5c — kaynak / ortam / kampanya başına; gelir aralıktaki ziyaretlerin bugüne kadar tahsil edilmiş faturaları (en çok ziyaretli azami grup)"
