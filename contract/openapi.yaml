          type: array
          minItems: 2
          maxItems: 50
          items:
            oneOf:
              - $ref: "#/components/schemas/YuklemeAdimi"
              - $ref: "#/components/schemas/EkranAdimi"
              - $ref: "#/components/schemas/PaywallAdimi"
