# Huni ↔ çekirdek sözleşmesi (R2) — TEK KAYNAK.
# Çekirdek: testlerde gerçek yanıtlar buna göre doğrulanır.
# Huni: TypeScript tipleri buradan ÜRETİLİR (contract/ → funnel/src/sozlesme/api.ts);
# bin/kontrol üretilen dosyanın güncel olduğunu ölçer.
openapi: 3.1.0
info:
  title: MyWeb2Wave çekirdek API
  version: 0.1.0
paths:
  /checkout/sessions:
    post:
      operationId: createCheckoutSession
      summary: Paywall'dan Stripe Checkout oturumu açar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, plan]
              properties:
                app:
                  description: Hangi kendi uygulamamız (A4); çekirdek config/packages/uygulamalar.yaml
                  type: string
                  enum: [keepchat]
                plan: { $ref: "#/components/schemas/PlanAnahtari" }
                ulke: { type: string, pattern: "^[A-Z]{2}$", description: "M1c: huni adresindeki ülke testi (paywall'daki para birimiyle aynı seçim)" }
                sartOnayi: { type: boolean, description: "M2b: paywall şart onay kutusu işaretlendi — Stripe oturum/abonelik metadata.sart_onayi" }
                gomulu: { type: boolean, description: "M2d: ödeme paywall sayfasında gömülü (Stripe.js yüklendiyse); sunucuda yayımlanabilir anahtar yoksa yok sayılır" }
                ziyaret:
                  description: /huni/ziyaretler'in döndürdüğü kimlik (A6); tanınmazsa ödeme yine açılır
                  type: string
                  format: uuid
      responses:
        "201":
          description: "Oturum açıldı: gömülüde istemci Stripe.js ile sayfada açar (clientSecret + anahtar), değilse url'ye yönlenir (M2d)"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                  - type: object
                    additionalProperties: false
                    required: [clientSecret, anahtar]
                    properties:
                      clientSecret: { type: string, description: "Stripe gömülü ödeme oturumunun istemci sırrı" }
                      anahtar: { type: string, description: "Stripe yayımlanabilir anahtarı (pk_…)" }
        "400":
          description: Gövde JSON değil
        "422":
          description: Bilinmeyen uygulama ya da plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hata"
        "502":
          description: Ödeme sağlayıcısına ulaşılamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hata"
  /huni/ziyaretler:
    post:
      operationId: recordFunnelVisit
      summary: Huni sayfası açıldı; hangi reklamdan geldiği (A6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app]
              properties:
                app: { type: string, enum: [keepchat] }
                utm_source: { $ref: "#/components/schemas/AtifAlani" }
                utm_medium: { $ref: "#/components/schemas/AtifAlani" }
                utm_campaign: { $ref: "#/components/schemas/AtifAlani" }
                utm_content: { $ref: "#/components/schemas/AtifAlani" }
                utm_term: { $ref: "#/components/schemas/AtifAlani" }
                fbclid: { $ref: "#/components/schemas/AtifAlani" }
                ttclid: { $ref: "#/components/schemas/AtifAlani" }
                huni: { $ref: "#/components/schemas/HuniKimligi" }
                surum: { type: integer, minimum: 1, description: "Görülen huni ve sürümü (A7, A8); yayınlanmış bir çift değilse yok sayılır" }
                izin: { type: boolean, description: "Reklam ölçümü izni önceden verildi (H6a, A12). Yoksa fbclid/ttclid saklanmaz" }
                deneyler: { $ref: "#/components/schemas/DeneyAtamasi" }
      responses:
        "201":
          description: Kaydedildi; ödeme oturumu açarken gönderilecek kimlik
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ziyaret]
                properties:
                  ziyaret: { type: string, format: uuid }
        "400": { description: Gövde JSON değil }
        "422":
          description: Bilinmeyen uygulama ya da geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "429":
          description: "Ç34: bu IP'den dakikada 120'den fazla ziyaret; huni yine çalışır"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/{app}:
    get:
      operationId: getPublishedFunnel
      summary: Kuralların seçtiği huninin yayınlanmış en son tanımı (A7, A8); 60 sn yalnız tarayıcı önbelleği (M1c fiyat ülkeye göre)
      description: Yalnız seçim parametrelerini gönder (fbclid gibi tıklama kimlikleri önbelleği bozar).
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: k, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_source, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_campaign, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: utm_content, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: huni, in: query, required: false, description: "Doğrudan test adresi; yönlendirme deneyi uygulanmaz (M4a)", schema: { $ref: "#/components/schemas/HuniKimligi" } }
        - { name: tohum, in: query, required: false, description: "M4a: sekme tohumu (sessionStorage) — deney varyantı bundan hesaplanır; yoksa deney yok", schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" } }
        - { name: ulke, in: query, required: false, description: "M1c: ülke testi (ISO 3166-1, ör. DE) — IP yerine bu ülkenin para birimi", schema: { type: string, pattern: "^[A-Z]{2}$" } }
      responses:
        "200":
          description: Yayındaki sürüm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuniYayini" }
        "404":
          description: Yayınlanmış huni yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/{app}/taslak:
    get:
      operationId: getDraftFunnel
      summary: İmzalı, süreli önizleme anahtarıyla bir huninin taslağı ya da yayındaki sürümü (A7, Ç70)
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: huni, in: query, required: true, schema: { $ref: "#/components/schemas/HuniKimligi" } }
        - { name: anahtar, in: query, required: true, schema: { type: string } }
        - { name: yayin, in: query, required: false, description: "1 ise taslak yerine yayındaki son sürüm (Ç70: panelden ölçümsüz bakış)", schema: { type: string, enum: ["1"] } }
        - { name: ulke, in: query, required: false, description: "M1c: ülke testi (ISO 3166-1, ör. DE) — IP yerine bu ülkenin para birimi", schema: { type: string, pattern: "^[A-Z]{2}$" } }
      responses:
        "200":
          description: Taslak (surum null) ya da yayin=1 ile yayındaki sürüm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HuniYayini" }
        "403":
          description: Anahtar yok, yanlış ya da süresi geçmiş; yayin=1 ise huni yayınlanmamış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/ziyaretler/{ziyaret}/ilerleme:
    post:
      operationId: recordFunnelProgress
      summary: Anket adımına ulaşıldı ya da adımın cevabı verildi (A6)
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sira, adim]
              properties:
                sira: { type: integer, minimum: 0, maximum: 50, description: Adımın huni tanımındaki sırası }
                adim: { $ref: "#/components/schemas/HuniKimligi" }
                cevap: { $ref: "#/components/schemas/HuniKimligi" }
                cevaplar:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/HuniKimligi" }
                cevapMetni: { type: string, maxLength: 500 }
              not:
                required: [cevap, cevaplar]
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422":
          description: Geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/ziyaretler/{ziyaret}/eposta:
    post:
      operationId: recordFunnelEmail
      summary: Huninin e-posta adımı (E1) — adres ödeme sayfasını doldurur; izinliyse yeniden ulaşmaya saklanır
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eposta]
              properties:
                eposta: { type: string, format: email, maxLength: 254 }
                pazarlamaIzni: { type: boolean, description: "İşaretsiz gönderim önceki izni kaldırır" }
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422":
          description: Geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/ziyaretler/{ziyaret}/izin:
    post:
      operationId: grantMeasurementConsent
      summary: Onay şeridinde reklam ölçümüne izin verildi (H6a, A12); o anki tıklama kimlikleri
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fbclid: { $ref: "#/components/schemas/AtifAlani" }
                ttclid: { $ref: "#/components/schemas/AtifAlani" }
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422":
          description: Geçersiz alan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
    delete:
      operationId: revokeMeasurementConsent
      summary: Ziyaretin reklam ölçümü iznini geri al; bekleyen paylaşım yüklerini sil
      parameters:
        - { name: ziyaret, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: İzin geri alındı }
        "404":
          description: Ziyaret yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/portal-baglantisi:
    post:
      operationId: requestPortalLink
      summary: "M6b2 (A19) — e-postaya tek kullanımlık müşteri portalı bağlantısı; abonelik olsun olmasın 202 (hesap sızdırmaz), e-posta başına saatte en çok 3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, eposta]
              properties:
                app: { type: string, enum: [keepchat] }
                eposta: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: İstek alındı (abonelik varsa e-posta gider) }
        "400": { description: Gövde JSON değil }
        "422":
          description: Bilinmeyen uygulama ya da geçersiz e-posta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /huni/giris-baglantisi:
    post:
      operationId: createLoginLink
      summary: Başarı sayfası ödemeden sonra tek kullanımlık giriş bağlantısı ister (Ç46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app, oturum]
              properties:
                app:
                  type: string
                  enum: [keepchat]
                oturum:
                  description: Stripe Checkout oturum kimliği (başarı sayfası adresindeki session_id)
                  type: string
                  pattern: "^cs_[A-Za-z0-9_]{1,250}$"
      responses:
        "201":
          description: Bağlantı üretildi; tek kullanımlık, süreli
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uygulama_adresi, son_kullanma, deneme]
                properties:
                  uygulama_adresi: { type: string, description: "<şema>://giris?jeton=… — uygulamayı açar" }
                  son_kullanma: { type: string, format: date-time }
                  deneme: { type: boolean, description: "Ç118 — oturum tutarı 0 (kartlı deneme); reklam pikseli Purchase yerine StartTrial gönderir" }
        "400": { description: Gövde JSON değil }
        "404":
          description: Ödeme henüz işlenmedi (webhook gelmedi) ya da yok — sayfa yeniden dener
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "410":
          description: Ödemeden sonraki pencere kapandı; bağlantı e-postada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
        "429":
          description: Bu ödeme için bağlantı sınırı doldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/giris/kullan:
    post:
      operationId: redeemLoginLink
      summary: Uygulamanın SUNUCUSU giriş bağlantısındaki jetonu kullanır; kullanıcıyı kişiye bağlar (Ç46)
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jeton, kullanici]
              properties:
                jeton: { type: string, minLength: 1 }
                kullanici: { type: string, minLength: 1, description: Uygulamadaki kullanıcı kimliği }
      responses:
        "200":
          description: Bağlandı; jeton artık geçersiz
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kisi]
                properties:
                  kisi: { type: string, format: uuid }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
  /apps/{app}/baglama/kod:
    post:
      operationId: requestLinkCode
      summary: Uygulamanın SUNUCUSU kullanıcının e-postasına 6 haneli kod gönderir (A5)
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Kod gönderildi (e-postanın varlığı dışarıdan anlaşılmaz) }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
        "429":
          description: Bu e-postaya 10 dakikada 3'ten fazla kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/baglama/dogrula:
    post:
      operationId: verifyLinkCode
      summary: Kod doğruysa uygulamadaki kullanıcıyı kişiye bağlar
      security: [{ uygulamaAnahtari: [] }]
      parameters: [{ $ref: "#/components/parameters/App" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, kod, kullanici]
              properties:
                email: { type: string, format: email }
                kod: { type: string, pattern: "^[0-9]{6}$" }
                kullanici: { type: string, minLength: 1, description: Uygulamadaki kullanıcı kimliği }
      responses:
        "200":
          description: Bağlandı
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kisi]
                properties:
                  kisi: { type: string, format: uuid, description: Kalıcı kişi kimliği (ileride StoreKit appAccountToken) }
        "400": { description: Gövde JSON değil }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422": { $ref: "#/components/responses/IstekHatasi" }
  /apps/{app}/kullanicilar/{kullanici}/hak:
    get:
      operationId: getEntitlement
      summary: Bu kullanıcının bu uygulamada aktif aboneliği var mı (A5 erişim kuralı)
      security: [{ uygulamaAnahtari: [] }]
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: kullanici, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Hak
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [aktif, durum]
                properties:
                  aktif: { type: boolean }
                  durum: { type: [string, "null"], description: En iyi aboneliğin Stripe durumu; abonelik yoksa null }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "404":
          description: Kullanıcı hiçbir kişiye bağlanmamış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/olaylar:
    get:
      operationId: listEvents
      summary: "M7c1 (A21) — uygulamanın olay akışı, imleçle; kişisel veri yok (sözlük). Yarım işlemler beklenir; sıra işlem sırası"
      security: [{ uygulamaAnahtari: [] }]
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: imlec, in: query, required: false, description: "Önceki yanıtın imleci; yoksa baştan", schema: { type: string } }
        - { name: sinir, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Olaylar
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [olaylar, imlec, devam]
                properties:
                  olaylar:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ziyaret, ad, veri, zaman]
                      properties:
                        ziyaret: { type: string, format: uuid }
                        ad: { type: string }
                        veri: { type: object }
                        zaman: { type: string }
                  imlec: { type: [string, "null"], description: "Son verilen olayın yeri; olay yoksa gönderilen imleç (baştansa null)" }
                  devam: { type: boolean, description: "Hemen ardından daha var (tekrar iste)" }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "422":
          description: Bozuk imleç
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /apps/{app}/kullanicilar/{kullanici}/portal:
    post:
      operationId: createPortalSession
      summary: "M6b (A19) — kişinin Stripe müşteri portalı oturumu (kart, iptal dönem sonunda, faturalar); adres kısa ömürlü, bir kez açılır"
      security: [{ uygulamaAnahtari: [] }]
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: kullanici, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Portal adresi (Stripe)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [adres]
                properties:
                  adres: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Yetkisiz" }
        "404":
          description: "unknown_user: kullanıcı kişiye bağlanmamış; no_subscription: bu uygulamada aboneliği yok"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
        "503":
          description: "portal_not_configured (app:stripe-portal:kur koşulmadı) ya da stripe_error"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hata" }
  /panel/api/rapor:
    get:
      operationId: panelRaporu
      summary: Panel raporu (A6/2, B5) — yalnız oturumlu yönetici; girişsizse güvenlik duvarı /panel/giris'e yönlendirir
      parameters:
        - name: gun
          in: query
          required: false
          description: Zaman aralığı; tanınmayan değer 30 sayılır
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: Seçilen aralıktaki sayımlar, izin oranı, anket ve ziyaret satırları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelRaporu" }
  /panel/api/ai/durum:
    get:
      operationId: panelAiDurumu
      summary: Panel AI asistanı açık mı (A2) — anahtar yoksa kapalı
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelAiDurumu" }
  /panel/api/ai/huniler/{app}/{huni}/sohbet:
    post:
      operationId: panelAiSohbet
      summary: İstemi açık huninin TASLAĞINA uygular (A2); ilerleme Server-Sent Events. Yayınlamaz.
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
        - { name: huni, in: path, required: true, schema: { $ref: "#/components/schemas/HuniKimligi" } }
        - name: X-CSRF-Token
          in: header
          required: true
          description: Düzenleyici sayfasının jetonu (huni-<app>)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [istem]
