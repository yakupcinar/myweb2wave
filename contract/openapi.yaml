          items:
            type: object
            additionalProperties: false
            required: [kaynak, ortam, kampanya, reklam, ziyaret, odemeye_gecti, deneme, odedi, gelir]
            properties:
              kaynak: { type: string }
              ortam: { type: [string, "null"] }
              kampanya: { type: [string, "null"] }
              reklam: { type: boolean }
              ziyaret: { type: integer, minimum: 0 }
              odemeye_gecti: { type: integer, minimum: 0 }
              deneme: { type: integer, minimum: 0 }
              odedi: { type: integer, minimum: 0 }
              gelir: { type: array, items: { $ref: "#/components/schemas/PanelTutar" } }
        kohort:
          description: "M5c — ziyaretin UTC haftası (pazartesi, en yeni önce); pencerede ziyaret başına birikimli gelir (0 = ilk 24 saat); pencere haftanın son ziyareti için dolmadıysa olgun değil, tutar yok"
          type: array
          items:
            type: object
            additionalProperties: false
            required: [hafta, ziyaret, pencereler]
            properties:
              hafta: { type: string, format: date }
              ziyaret: { type: integer, minimum: 1 }
              pencereler:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [gun, olgun, kisiBasi]
                  properties:
                    gun: { type: integer, enum: [0, 7, 30, 60] }
                    olgun: { type: boolean }
                    kisiBasi: { type: array, items: { $ref: "#/components/schemas/PanelTutar" } }
        kampanyalar:
          description: "M5d — Meta kampanyası başına aralıktaki harcama; ziyaret / ödedi / gelir aynı adlı utm_campaign ile Meta'dan gelen ziyaretlerden (aralıkta gelen, bugüne kadar); ROAS hesabın para biriminde gelir / harcama"
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kampanya, harcama, ziyaret, odedi, gelir, roas]
            properties:
              kampanya: { type: string }
              harcama: { $ref: "#/components/schemas/PanelTutar" }
              ziyaret: { type: integer, minimum: 0 }
              odedi: { type: integer, minimum: 0 }
              gelir: { type: array, items: { $ref: "#/components/schemas/PanelTutar" } }
              roas: { type: [number, "null"], minimum: 0 }
        metinCevaplari:
          description: 90 gün içinde, en yeni azami kadar
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zaman, app, soru, cevap]
            properties:
              zaman: { type: string }
              app: { type: string }
              soru: { type: string }
              cevap: { type: string }
    DeneyAtamasi:
      description: "M4a: aktif deney adı → ziyaretçinin varyantı (koşulda deney.<ad>); çekirdek yalnız aktif deneyin geçerli varyantını yazar"
